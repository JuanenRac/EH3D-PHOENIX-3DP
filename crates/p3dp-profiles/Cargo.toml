[package]
name = "p3dp-profiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The catalog of printers built from public facts (volume, nozzle, dialect, ways of connecting, multi-material, temperature limits of the maker), each profile marked verified or not"

[lib]
name = "p3dp_profiles"
path = "src/lib.rs"

[dependencies]
p3dp-core = { path = "../p3dp-core" }
# the catalog of printers of the suite: the figures of each model with the page of the maker (the sibling folder EH3D-COMMON is needed)
eh3d-printers = { version = ">=0.0.1", path = "../../../EH3D-COMMON/crates/printers" }
# the database of printing materials of the suite (the sibling folder EH3D-COMMON is needed)
eh3d-printmaterials = { version = ">=0.0.1", path = "../../../EH3D-COMMON/crates/printmaterials" }
