[package]
name = "p3dp-server-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The layer between PHOENIX-3DP and the EH3D server: the server settings with their ranges, and the routes of the printer plugin of the server over the one client of the suite, with a server in memory for the tests"

[lib]
name = "p3dp_server_bridge"
path = "src/lib.rs"

[dependencies]
p3dp-core = { path = "../p3dp-core" }
p3dp-gcode = { path = "../p3dp-gcode" }
# the one client every program of the suite uses to talk to the server (login, renewal, retries, errors in eight languages); it lives in a sibling repository
eh3d-serverclient = { version = ">=0.0.1", path = "../../../EH3D-COMMON/crates/serverclient" }
