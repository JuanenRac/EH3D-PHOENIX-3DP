[workspace]
members = [
    ".",
    "crates/p3dp-core",
    "crates/p3dp-formats",
    "crates/p3dp-profiles",
    "crates/p3dp-gcode",
    "crates/p3dp-link",
    "crates/p3dp-server-bridge",
    "crates/p3dp-slicer",
    "crates/p3dp-viewer",
]
resolver = "2"

[workspace.package]
version = "0.0.8"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-PHOENIX-3DP"

[package]
name = "eh3d-phoenix-3dp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A program to prepare and send 3D prints: models, printer profiles, safe G-code and the link to the printers and to the EH3D server, tried so far only against simulators"
readme = "README.md"

[lib]
name = "eh3d_phoenix_3dp"
path = "src/lib.rs"

[[bin]]
name = "phoenix-3dp"
path = "src/main.rs"

# the pictures of the workspaces of the window, drawn from the model of the arrangement alone (no window): `cargo run --example workspace_pictures`
[[example]]
name = "workspace_pictures"
path = "tools/workspace_pictures.rs"

[features]
default = []
# the window (egui): `cargo run --release --features gui`
gui = ["dep:eframe", "eh3d-view/gui", "eh3d-dock/gui"]

[dependencies]
p3dp-core = { path = "crates/p3dp-core" }
p3dp-formats = { path = "crates/p3dp-formats" }
p3dp-profiles = { path = "crates/p3dp-profiles" }
p3dp-gcode = { path = "crates/p3dp-gcode" }
p3dp-link = { path = "crates/p3dp-link" }
p3dp-server-bridge = { path = "crates/p3dp-server-bridge" }
p3dp-slicer = { path = "crates/p3dp-slicer" }
p3dp-viewer = { path = "crates/p3dp-viewer" }

# the client of the suite for the EH3D server and the panel of its settings, the state of the link and the login that the other programs of the suite show (the sibling folder EH3D-COMMON is needed)
eh3d-serverclient = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/serverclient" }
eh3d-view = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/view", default-features = false }

# the frame of the window: panels that dock, float and fold, workspaces, the menu bar and the shortcuts; the model has no window, the drawing is the feature `gui`
eh3d-dock = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/dock", default-features = false }

# the database of printing materials of the suite (the catalog of filaments and resins of the profiles reads it; the check before printing asks it for the flow and the drying)
eh3d-printmaterials = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/printmaterials" }

# the window
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"], optional = true }

# the window of Linux needs a windowing system chosen at build time (X11 and Wayland); Windows and macOS have their own
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }

[profile.release]
opt-level = 3
lto = true
