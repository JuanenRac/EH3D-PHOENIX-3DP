# PHOENIX-3DP settings. Every key is optional; a key that is not known is an error that names its line.
lang = en
default_printer = bambu-lab-a1

# the limits of the readers: a bigger file or model is refused, never cut
limit_max_file_mib = 256
limit_max_triangles = 5000000
limit_max_extent_mm = 2000

# the link to the EH3D server (empty address: no server). The token is never shown or logged.
server_address =
server_token =
server_machine =
server_timeout_s = 15
server_retries = 2
server_mdns = off

# what a print costs: the price of a kilogram of filament and of a litre of resin (0: no cost is shown), and how much more resin than the part
# the supports, the raft and the drips take, in percent
price_filament_per_kg = 20
price_resin_per_litre = 40
resin_waste_percent = 20

# the report of a slice: how many of the slowest layers it lists, and the time in seconds under which a layer is called short (0: none)
report_slowest_layers = 5
report_short_layer_s = 5

# the queue of the server: refuse a job whose name repeats one that still waits on the machine, and the most jobs that may wait on one
queue_refuse_duplicates = on
queue_max_waiting = 20

# how far a plain G-code file is searched for its thumbnails (the start) and for the figures of the print (the end), in KiB, and how many thumbnails are taken
limit_gcode_head_kib = 1024
limit_gcode_tail_kib = 64
limit_gcode_thumbnails = 8

# stand-alone mode: straight to a printer, with no shared queue and no permissions
direct_mode = off

# the keyboard shortcuts of the window: the scheme (family or own) and, if you like, a change for any action
# (a chord such as Ctrl+Alt+O, or none to take the shortcut off; two actions on one chord is an error)
shortcut_scheme = family
# key_open = Ctrl+Alt+O
# key_refresh = none

# the look of the window (dark or light), the distance between the lines of the grid of the bed in millimetres, the gap that "arrange" leaves
# between the parts, arranging by itself each time a part is added, and the short hints that explain each panel
theme = dark
grid_mm = 10
arrange_gap_mm = 5
arrange_on_add = on
ui_hints = on

# the temperature limits you set for a printer of the catalog (nozzle, bed, chamber in degrees; the chamber may be none). The window writes this line when
# you apply new limits; they replace the figures of the catalog and make the limits yours, and the profile counts as not tried
# printer_limits_prusa-mk4s = 280,110,none
